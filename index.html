<title>高中数学动态模型 — 课堂演示平台</title>

<!-- ============================================================
     高中数学课堂演示平台（单文件版 · 国创赛参赛作品）
     - 覆盖：基本函数 / 三角函数 / 圆锥曲线 / 立体几何 / 数列与代数 / 统计与导数
     - 共 23 个参数化动态模型（含 3D 立体几何、单位圆、三类自定义函数/方程、多函数对比），顶部导航切换
     - 支持一键保存当前图像（PNG 截图）
     - 绘图：Canvas；公式：MathJax（离线自动降级为纯文本）
     - 用法：保存为 .html 双击打开即可；投影仪大字号、柔和配色
     ============================================================ -->

<style>
  /* ========== 全局：大字号、柔和配色，适配教室投影仪 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 20px;
    background: #eef2f7;
    color: #2d3748;
    display: flex; flex-direction: column;
  }

  /* ========== 顶部标题栏 ========== */
  header {
    background: #ffffff;
    padding: 10px 24px;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    box-shadow: 0 1px 4px rgba(30, 60, 120, .10);
  }
  header h1 { font-size: 29px; color: #1e3a8a; letter-spacing: 1px; }
  header .sub { font-size: 17px; color: #64748b; }

  /* ========== 模型导航（分类 + 模型按钮） ========== */
  #nav {
    background: #ffffff;
    margin: 12px 16px 0;
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(30, 60, 120, .08);
    display: flex; flex-direction: column; gap: 8px;
  }
  .catRow, .modelRow { display: flex; flex-wrap: wrap; gap: 8px; }
  .catBtn {
    font-size: 17px; color: #334155;
    background: #f1f5f9; border: 2px solid #cbd5e1;
    border-radius: 999px; padding: 5px 16px; cursor: pointer;
  }
  .catBtn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .catBtn:hover { border-color: #2563eb; }
  .modelBtn {
    font-size: 19px; color: #334155;
    background: #fff; border: 2px solid #cbd5e1;
    border-radius: 10px; padding: 7px 18px; cursor: pointer;
  }
  .modelBtn.active { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: bold; }
  .modelBtn:hover { border-color: #2563eb; }

  /* ========== 中部：控制面板 + 绘图区 ========== */
  main {
    flex: 1; min-height: 0;
    display: flex; gap: 16px;
    padding: 12px 16px;
  }

  #panel {
    width: 340px; flex: none;
    background: #ffffff;
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(30, 60, 120, .08);
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 22px; font-weight: bold; color: #1e3a8a;
    padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;
  }
  .ctrl-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ctrl-head label { font-size: 21px; font-weight: bold; color: #334155; }
  .ctrl-head .val {
    font-size: 27px; font-weight: bold; color: #2563eb;
    min-width: 74px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ctrl-cap { font-size: 14px; color: #94a3b8; margin-top: 2px; }

  /* 大号滑块（投影仪专用尺寸） */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 12px;
    border-radius: 6px;
    background: #dbe3ee;
    outline: none; cursor: pointer;
    margin: 6px 0 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 32px; height: 32px; border-radius: 50%;
    background: #2563eb;
    border: 3px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .30);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 30px; height: 30px; border-radius: 50%;
    background: #2563eb;
    border: 3px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .30);
    cursor: pointer;
  }

  .chk {
    display: flex; align-items: center; gap: 12px;
    font-size: 20px; color: #334155; cursor: pointer;
  }
  input[type="checkbox"] {
    width: 27px; height: 27px;
    accent-color: #2563eb; cursor: pointer;
  }

  #btnReset {
    font-size: 22px; font-weight: bold;
    color: #ffffff; background: #2563eb;
    border: none; border-radius: 12px;
    padding: 12px 0; cursor: pointer;
    margin-top: 2px;
  }
  #btnReset:hover { background: #1d4ed8; }

  /* 保存截图按钮（标题栏右侧常驻） */
  #btnShot {
    align-self: center; margin-left: auto;
    font-size: 19px; font-weight: bold;
    color: #1e3a8a; background: #e0e9f7;
    border: 2px solid #b9cdf0; border-radius: 10px;
    padding: 8px 18px; cursor: pointer;
  }
  #btnShot:hover { background: #d3e2f7; }

  /* 下拉选择（3D 模型选几何体用） */
  select {
    font-size: 20px; padding: 8px 10px;
    border: 2px solid #cbd5e1; border-radius: 10px;
    background: #ffffff; color: #334155;
    width: 100%; cursor: pointer; margin: 4px 0;
  }

  /* 函数表达式输入框（导数模型用） */
  .exprInput {
    font-size: 22px; padding: 8px 10px;
    border: 2px solid #cbd5e1; border-radius: 10px;
    background: #ffffff; color: #1e3a8a;
    width: 100%; margin: 4px 0;
    font-family: Consolas, "Courier New", monospace;
    letter-spacing: 1px;
  }
  .exprInput:focus { outline: none; border-color: #2563eb; }

  /* 多行函数输入框（多函数图像模型用） */
  textarea.exprInput {
    font-size: 20px; padding: 8px 10px;
    border: 2px solid #cbd5e1; border-radius: 10px;
    background: #ffffff; color: #1e3a8a;
    width: 100%; margin: 4px 0; resize: vertical;
    font-family: Consolas, "Courier New", monospace;
    line-height: 1.6;
  }
  textarea.exprInput:focus { outline: none; border-color: #2563eb; }

  /* 面板小按钮（如立体几何「清空笔迹」） */
  .miniBtn {
    font-size: 18px; font-weight: bold;
    color: #1e3a8a; background: #eef2ff;
    border: 2px solid #c7d2fe; border-radius: 10px;
    padding: 9px 0; width: 100%; cursor: pointer; margin: 4px 0;
  }
  .miniBtn:hover { background: #e0e7ff; }

  .hint { font-size: 15px; color: #64748b; line-height: 1.6; }

  #canvasWrap {
    flex: 1; min-width: 0; position: relative;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(30, 60, 120, .08);
    overflow: hidden;
  }
  #plot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* 画布右上角：视图控制按钮（放大/缩小/重置） */
  #viewBtns {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 8px; z-index: 2;
  }
  #viewBtns button {
    font-size: 20px; font-weight: bold;
    color: #1e3a8a; background: rgba(255, 255, 255, .92);
    border: 2px solid #cbd5e1; border-radius: 10px;
    padding: 6px 14px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
  }
  #viewBtns button:hover { background: #eef4ff; }
  /* 画布右下角：操作提示 */
  #opHint {
    position: absolute; right: 14px; bottom: 12px;
    font-size: 15px; color: #94a3b8;
    pointer-events: none;
  }
  #canvasNote {
    position: absolute; left: 14px; bottom: 12px;
    max-width: 92%;
    font-size: 18px; color: #1e3a8a;
    background: rgba(255, 255, 255, .88);
    padding: 7px 15px; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    line-height: 1.5;
    pointer-events: none;
  }

  /* ========== 底部：数学公式显示区 ========== */
  #formulaArea {
    background: #ffffff;
    margin: 0 16px 16px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(30, 60, 120, .08);
    overflow: hidden;   /* 配合折叠时裁剪内容 */
  }
  /* 折叠开关条（大尺寸，便于投影操作） */
  .fa-toggle {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; cursor: pointer; user-select: none;
    font-size: 20px; font-weight: bold; color: #1e3a8a;
  }
  .fa-toggle:hover { background: #f1f5f9; }
  .fa-arrow { font-size: 18px; color: #64748b; }
  /* 公式内容主体：可收放（max-height 过渡，收起时归零） */
  .fa-body {
    display: flex; gap: 24px; align-items: stretch;
    padding: 12px 20px 14px;
    max-height: 420px; overflow: hidden;
    transition: max-height .25s ease, padding .25s ease;
  }
  #formulaArea.collapsed .fa-body { max-height: 0; padding-top: 0; padding-bottom: 0; }
  #formulaLeft {
    flex: 1.5; min-width: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
  }
  #formulaLeft .m { font-size: 20px; color: #1e3a8a; min-height: 32px; }
  #formulaLeft .note { font-size: 18px; color: #b45309; min-height: 26px; }
  #valueTable { flex: 1; min-width: 0; border-collapse: collapse; align-self: center; width: 100%; }
  #valueTable td { font-size: 18px; padding: 4px 14px; border-bottom: 1px solid #edf1f7; }
  #valueTable td.k { color: #475569; white-space: nowrap; }
  #valueTable td.v { color: #1e3a8a; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; }
</style>

<body>

<script>
(function () {
  'use strict';

  /* ================================================================
     ① 全局状态
     ================================================================ */
  var gridOn = true;                 // 是否显示网格（全局开关）
  var currentId = 'linear';          // 当前模型 id（默认进入基本函数·一次函数）
  var states = {};                   // 各模型参数状态：states[模型id] = {参数...}
  var DEMO_SPEED = (2 * Math.PI) / 28;  // 椭圆演示点 P 的角速度（约 28 秒一圈）
  var DEFAULT_NOTE = '提示：拖动左侧滑块，观察图像与公式实时变化';
  // 用户视图变换（叠加在模型默认取景之上）：缩放倍数 + 平移像素
  var viewZoom = 1, viewPanX = 0, viewPanY = 0;
  var showCoord = true;   // 坐标系（坐标轴+网格）显示开关：看图时可隐藏

  /* ================================================================
     ② DOM 引用
     ================================================================ */
  var canvas = document.getElementById('plot');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('canvasWrap');
  var panel = document.getElementById('panel');
  var noteEl = document.getElementById('canvasNote');
  var fEq = document.getElementById('fEq');
  var fC = document.getElementById('fC');
  var fE = document.getElementById('fE');
  var fNote = document.getElementById('fNote');
  var vtBody = document.getElementById('vtBody');

  /* ================================================================
     ③ 通用工具
     ================================================================ */
  function fmt(x) { return String(parseFloat(x.toFixed(2))); }   // 去掉尾零
  function fmt2(x) { return x.toFixed(2); }
  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---- 自定义函数：把用户输入表达式编译为可执行函数（模型计算入口） ----
     支持：x、^（乘方）、+ - * / 括号、sin cos tan ln lg sqrt abs exp、pi、e
     注意：乘法必须写 *（如 2*x），函数名后必须带括号（如 sin(x)） */
  /** 把用户输入表达式转换成 JS 源码（替换函数名/常量/^ 等） */
  function exprSrc(expr) {
    return String(expr || '')
      // 函数名统一替换（单次 replace 回调：避免插入的 Math.sin( 等被后续步骤二次替换）
      .replace(/\b(asin|acos|atan|sin|cos|tan|ln|lg|log|sqrt|abs|exp)\(/g, function (m, name) {
        if (name === 'lg') return 'Math.log10(';
        if (name === 'ln' || name === 'log') return 'Math.log(';
        return 'Math.' + name + '(';
      })
      .replace(/\bpi\b/g, 'Math.PI')
      .replace(/\be\b/g, 'Math.E')
      .replace(/\^/g, '**')
      .replace(/\(-/g, '(0-')   // JS 语法：一元负号不能直接放在 ** 左侧（如 e^(-x^2)）
      .replace(/^-/, '0-');     // 表达式以负号开头（如 -x^2）
  }

  /** 编译单变量函数 f(x)（导数模型用） */
  function compileFn(expr) {
    try {
      var src = exprSrc(expr);
      if (!src) throw new Error('empty');
      var f = new Function('x', 'return (' + src + ');');
      var t = f(1);
      if (typeof t !== 'number' || !isFinite(t)) throw new Error('bad');
      return { fn: f, err: '' };
    } catch (err) {
      return { fn: null, err: '表达式有误' };
    }
  }

  /** 编译双变量函数 F(x,y)（自定义函数/方程模型用） */
  function compileFnXY(expr) {
    try {
      var src = exprSrc(expr);
      if (!src) throw new Error('empty');
      var f = new Function('x', 'y', 'return (' + src + ');');
      var t = f(1, 0);
      if (typeof t !== 'number' || !isFinite(t)) throw new Error('bad');
      return { fn: f, err: '' };
    } catch (err) {
      return { fn: null, err: '表达式有误' };
    }
  }

  /** 自定义函数/方程编译入口：显式 y=f(x) 或隐式 F(x,y)=0（含 = 或含变量 y） */
  function compileExpr2(expr) {
    var s = String(expr || '').trim();
    if (!s) return { fn: null, err: '请输入表达式', implicit: false };
    var hasEq = s.indexOf('=') >= 0;
    var body = s;
    if (hasEq) {
      var parts = s.split('=');
      if (parts.length !== 2) return { fn: null, err: '等号只能出现一次', implicit: true };
      body = '(' + parts[0] + ')-(' + parts[1] + ')';   // F(x,y) = 左 − 右 = 0
    }
    var implicit = hasEq || /\by\b/.test(body);
    var r = compileFnXY(body);
    if (r.err) return { fn: null, err: r.err, implicit: implicit };
    return { fn: r.fn, err: '', implicit: implicit };
  }

  /** 数值求导（中心差分）：f′(x) ≈ [f(x+h) − f(x−h)] / (2h)，对任意输入函数有效 */
  function numDeriv(f, x) {
    var h = 1e-5 * (Math.abs(x) + 1);
    return (f(x + h) - f(x - h)) / (2 * h);
  }

  /** 把用户输入的表达式转成可安全显示的 LaTeX（用于公式区） */
  function fnToLatex(expr) {
    var s = String(expr || '').replace(/[\\{}#$&_~%]/g, '\\$&');
    s = s.replace(/\b(asin|acos|atan|sin|cos|tan|ln|lg|sqrt|abs|exp)\(/g, '\\$1(');
    s = s.replace(/\bpi\b/g, '\\pi ');
    s = s.replace(/\be\b/g, '\\mathrm{e}');
    // 统一处理 ^（单次 replace 回调：避免插入的 ^{...} 被再次扫描替换）
    s = s.replace(/\^\(([^)]*)\)|(\^-?\d+(?:\.\d+)?)|(\^[A-Za-z]+)|(\^)/g, function (m, g1, g2, g3) {
      if (g1 !== undefined) return '^{' + g1 + '}';
      if (g2 !== undefined) return '^{' + g2.slice(1) + '}';
      if (g3 !== undefined) return '^{' + g3.slice(1) + '}';
      return '\\char94 ';
    });
    s = s.replace(/\*/g, '\\cdot ');
    return s;
  }

  /* ================================================================
     ③+ 自定义函数/方程模型的绘制与公式（基本函数/三角函数/圆锥曲线共用）
     ================================================================ */

  /** 隐式曲线绘制：marching squares（网格采样 F(x,y)，线性插值画等值线 F=0）
      color：曲线颜色（默认蓝色；多函数模型可传其它颜色与显式函数区分） */
  function drawImplicit(F, r, color) {
    var N = 110, step = 2 * r / N;
    // 预计算网格值，避免重复求值
    var vals = [];
    for (var j = 0; j <= N; j++) {
      vals[j] = [];
      var yy = -r + j * step;
      for (var i = 0; i <= N; i++) {
        var v = F(-r + i * step, yy);
        vals[j][i] = isFinite(v) ? v : NaN;
      }
    }
    ctx.strokeStyle = color || '#2563eb'; ctx.lineWidth = 3; ctx.setLineDash([]);
    function drawSeg(a, b) {
      ctx.beginPath();
      ctx.moveTo(H.X(a.x), H.Y(a.y));
      ctx.lineTo(H.X(b.x), H.Y(b.y));
      ctx.stroke();
    }
    // 遍历每个网格单元：四角异号 → 在边上线性插值找零点，连成线段
    for (j = 0; j < N; j++) {
      for (i = 0; i < N; i++) {
        var v00 = vals[j][i], v10 = vals[j][i + 1], v01 = vals[j + 1][i], v11 = vals[j + 1][i + 1];
        if (isNaN(v00) || isNaN(v10) || isNaN(v01) || isNaN(v11)) continue;
        var x0 = -r + i * step, y0 = -r + j * step;
        var pts = [];
        if (v00 * v10 < 0) pts.push({ x: x0 + step * v00 / (v00 - v10), y: y0 });        // 底边（两端 v00/v10）
        if (v10 * v11 < 0) pts.push({ x: x0 + step, y: y0 + step * v10 / (v10 - v11) }); // 右边（两端 v10/v11）
        if (v11 * v01 < 0) pts.push({ x: x0 + step * v01 / (v01 - v11), y: y0 + step }); // 顶边（两端 v01/v11）
        if (v01 * v00 < 0) pts.push({ x: x0, y: y0 + step * v00 / (v00 - v01) });        // 左边（两端 v00/v01）
        if (pts.length < 2) continue;
        if (pts.length === 4) {
          // 鞍形歧义（曲线在单元内有两支）：用中心值判断正确配对，避免假线段
          var vC = F(x0 + step / 2, y0 + step / 2);
          if (isFinite(vC)) {
            if ((vC >= 0) === (v00 >= 0)) {
              drawSeg(pts[0], pts[1]);   // 底-右
              drawSeg(pts[2], pts[3]);   // 顶-左
            } else {
              drawSeg(pts[0], pts[3]);   // 底-左
              drawSeg(pts[1], pts[2]);   // 右-顶
            }
            continue;
          }
        }
        // 2 或 3 个零点：按边顺序连成折线（3 零点表示曲线在单元内拐弯，需连三段不丢线）
        ctx.beginPath();
        ctx.moveTo(H.X(pts[0].x), H.Y(pts[0].y));
        for (var k = 1; k < pts.length; k++) ctx.lineTo(H.X(pts[k].x), H.Y(pts[k].y));
        ctx.stroke();
      }
    }
  }

  /** 自定义函数/方程模型的绘制入口（显式用 plot，隐式用等值线） */
  function drawCustomFn(S, errText) {
    var r = S.r;
    H.setViewRect(-r, r, -r, r); H.grid(); H.axes();
    if (!S.fn) {
      H.text(0, 0, errText || '请输入正确的表达式（按回车确认）', { color: '#dc2626', size: 18, bold: true });
      return;
    }
    if (S.implicit) {
      drawImplicit(S.fn, r);
    } else {
      H.plot(function (x) { return S.fn(x, 0); }, '#2563eb', 3.5);
    }
  }

  /** 自定义函数/方程模型的公式区渲染 */
  function formulasCustom(S, examples) {
    if (!S.fn) {
      fEq.textContent = '表达式有误，请修改后按回车确认';
      fC.innerHTML = ''; fE.innerHTML = '';
      fNote.textContent = '支持：x、y、^、+、−、*、/、sin()、cos()、tan()、ln()、lg()、sqrt()、abs()、pi、e；乘法写 *；隐式方程用 =（如 x^2+y^2=4）';
      setTable([['当前输入', S.expr], ['示例', examples.join('、')]]);
      return;
    }
    var r = S.r;
    if (S.implicit) {
      setMath(fEq, fnToLatex(S.expr), S.expr);
      setMath(fC, '\\text{隐式方程：}F(x,y)=0\\text{，绘制等值线}', '隐式方程 F(x,y) = 0，绘制等值线');
    } else {
      setMath(fEq, 'y=' + fnToLatex(S.expr), 'y = ' + S.expr);
      setMath(fC, '\\text{显式函数：}y=f(x)', '显式函数：y = f(x)');
    }
    setMath(fE, '\\text{视野：}x,y\\in[-' + fmt(r) + ',' + fmt(r) + ']', '视野：x, y ∈ [−' + fmt(r) + ', ' + fmt(r) + ']');
    fNote.textContent = S.implicit
      ? '等值线法：在网格上找 F(x,y)=0 的点连线；可调「视野 ±r」或用滚轮缩放观察'
      : '曲线超出视野部分自动裁剪；可调「视野 ±r」或用滚轮缩放观察';
    setTable([
      ['表达式', S.expr],
      ['类型', S.implicit ? '隐式方程 F(x,y)=0' : '显式函数 y=f(x)'],
      ['视野', 'x, y ∈ [−' + fmt(r) + ', ' + fmt(r) + ']']
    ]);
  }

  /* ---- 函数模型的「可选自定义函数」支持（一次/二次/反比例/幂/指数/对数/三角等共用）---- */

  /** 编译可选自定义函数：expr 留空则 fn=null（用滑块参数），非空则编译用户函数 */
  function compileCustomExpr(st) {
    if (st.expr && String(st.expr).trim()) {
      var res = compileFn(st.expr);
      st.fn = res.fn; st.err = res.err;
    } else {
      st.fn = null; st.err = '';
    }
  }

  /** 绘制用户输入函数 y=f(x)：自适应纵轴（采样钳制 ±10、最小高度），followX0 时视野跟随切点 */
  function drawUserFnGraph(S, followX0) {
    var f = S.fn;
    var hx = 6;
    if (followX0 && isFinite(S.x0)) hx = Math.max(6, Math.abs(S.x0) + 1.5);
    var ymin = Infinity, ymax = -Infinity;
    for (var i = 0; i <= 200; i++) {
      var x = -hx + i * 2 * hx / 200, y = f(x);
      if (isFinite(y)) {
        if (y < -10) y = -10; else if (y > 10) y = 10;   // 钳制极端值
        if (y < ymin) ymin = y;
        if (y > ymax) ymax = y;
      }
    }
    if (!isFinite(ymin)) { ymin = -3; ymax = 3; }
    if (ymax - ymin < 6) { var mid = (ymax + ymin) / 2; ymin = mid - 3; ymax = mid + 3; }
    var pad = (ymax - ymin) * 0.15; ymin -= pad; ymax += pad;
    H.setViewRect(-hx, hx, ymin, ymax); H.grid(); H.axes();
    H.plot(f, '#2563eb', 3.5);
  }

  /** 函数模型的「自定义函数模式」公式区：显示 y=f(x) */
  function formulasUserFn(S) {
    setMath(fEq, 'y=' + fnToLatex(S.expr), 'y = ' + S.expr);
    setMath(fC, '\\text{用户自定义函数：}y=f(x)', '用户自定义函数：y = f(x)');
    setMath(fE, '\\text{视野自动适应，可用滚轮缩放/拖拽平移}', '视野自动适应，可用滚轮缩放/拖拽平移');
    fNote.textContent = '当前显示用户输入的函数图像；清空输入框回车可恢复滑块参数模型';
    setTable([
      ['表达式', S.expr],
      ['类型', '用户自定义函数 y=f(x)'],
      ['提示', '清空输入框回车可恢复默认模型']
    ]);
  }

  /* ---- 多函数图像模型：一次输入多个函数，同屏对比 ---- */
  var MULTI_COLORS = ['#2563eb', '#d97706', '#0f766e', '#dc2626', '#7c3aed', '#0891b2', '#65a30d', '#db2777'];

  /** 编译多个函数：按换行/分号拆分，每段编译为一个 {expr, fn, err}；另支持一个可选隐式方程 F(x,y)=0 */
  function compileMultiFn(st) {
    var parts = String(st.expr || '').split(/[;\n]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    st.fns = [];
    st.err = '';
    if (parts.length === 0) {
      st.err = '请输入至少一个函数';
    } else {
      if (parts.length > 8) { parts = parts.slice(0, 8); st.err = '最多显示 8 个函数，已截取前 8 个'; }
      parts.forEach(function (p) {
        var res = compileFn(p);
        st.fns.push({ expr: p, fn: res.fn, err: res.err });
      });
    }
    // 可选隐式方程 F(x,y)=0（用等值线法绘制，可与上方显式函数同屏）
    st.impFn = null; st.impErr = '';
    var impStr = String(st.imp || '').trim();
    if (impStr) {
      var res2 = compileExpr2(impStr);
      if (res2.fn) st.impFn = res2.fn;
      else st.impErr = res2.err || '表达式有误';
    }
  }

  /* ---- 多项式字符串（二次函数等使用）---- */
  function termLatex(coef, varStr, expStr, first) {
    if (coef === 0) return '';
    var s = first ? (coef < 0 ? '-' : '') : (coef < 0 ? ' - ' : ' + ');
    var abs = Math.abs(coef);
    if (abs !== 1) s += fmt(abs);
    return s + varStr + expStr;
  }
  function buildPolyLatex(a, b, c) {
    return termLatex(a, 'x', '^{2}', true) + termLatex(b, 'x', '', false) + termLatex(c, '', '', false);
  }
  function buildPolyPlain(a, b, c) {
    return termLatex(a, 'x', '²', true) + termLatex(b, 'x', '', false) + termLatex(c, '', '', false);
  }

  /* ---- 幂的写法（指数/对数/幂函数）---- */
  function powLatex(base, n) {
    if (n === 1) return String(base);
    if (n === 0) return '1';
    return base + '^{' + (typeof n === 'number' ? fmt(n) : n) + '}';
  }
  function powPlain(base, n) {
    if (n === 1) return String(base);
    if (n === 0) return '1';
    var s = typeof n === 'number' ? fmt(n) : String(n);   // n 可能是字符串（如 'x'）
    var sup = { '2': '²', '3': '³', '-1': '⁻¹', '-2': '⁻²', '-3': '⁻³', '0.5': '^0.5' };
    return base + (sup[s] || ('^' + s));
  }
  function powXLatex(n) {   // xⁿ 的写法
    if (n === 1) return 'x';
    if (n === 0) return '1';
    return 'x^{' + fmt(n) + '}';
  }
  function powXPlain(n) {
    if (n === 1) return 'x';
    if (n === 0) return '1';
    var sup = { '2': 'x²', '3': 'x³', '4': 'x⁴', '-1': 'x⁻¹', '-2': 'x⁻²', '-3': 'x⁻³' };
    return sup[fmt(n)] || ('x^' + fmt(n));
  }

  /* ---- 三角函数式子的写法 ---- */
  function buildTrigLatex(kind, A, w, phi, B) {
    var s = 'y=';
    if (A !== 1) s += fmt(A);
    s += '\\' + kind + '(';
    if (w !== 1) s += fmt(w);
    s += 'x';
    if (phi > 0) s += '+' + fmt(phi); else if (phi < 0) s += '-' + fmt(-phi);
    s += ')';
    if (B > 0) s += '+' + fmt(B); else if (B < 0) s += '-' + fmt(-B);
    return s;
  }
  function buildTrigPlain(kind, A, w, phi, B) {
    var s = 'y=';
    if (A !== 1) s += fmt(A);
    s += kind + '(';
    if (w !== 1) s += fmt(w);
    s += 'x';
    if (phi > 0) s += '+' + fmt(phi); else if (phi < 0) s += '-' + fmt(-phi);
    s += ')';
    if (B > 0) s += '+' + fmt(B); else if (B < 0) s += '-' + fmt(-B);
    return s;
  }

  /* ================================================================
     ④ 公式渲染工具（MathJax；离线自动降级为纯文本）
     ================================================================ */
  var mathReady = false;
  var typeTimer = null;

  function setMath(el, latex, plain) {
    if (mathReady) el.innerHTML = '\\(' + latex + '\\)';
    else el.textContent = plain;
  }
  function setTable(rows) {
    vtBody.innerHTML = rows.map(function (r) {
      return '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>';
    }).join('');
  }
  function typeset() {
    if (!mathReady) return;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(function () {
      MathJax.typesetPromise([document.getElementById('formulaArea')]).catch(function () {});
    }, 120);
  }

  /* ================================================================
     ⑤ 绘图助手 H（所有模型共用）
     ----------------------------------------------------------------
     - 每个模型的 draw(S) 先调用 H.setView 或 H.setViewRect 设定可视范围，
       再用 H.grid / H.axes / H.plot / H.line / H.dot / H.text 等绘制。
     ================================================================ */
  var H = {
    V: null,

    /** 以世界宽度 worldW、最小世界高度 worldHMin 设定可视范围（居中，x/y 比例一致） */
    setView: function (worldW, worldHMin) {
      var W = canvas.width, Hh = canvas.height;
      var viewH = Math.max(worldW * (Hh / W), worldHMin);
      var viewW = W * viewH / Hh;
      this.baseV = { ox: W / 2, oy: Hh / 2, scale: W / viewW };
      this.applyTransform(W, Hh);
    },

    /** 以指定世界矩形设定可视范围（自适应，用于数列等需自适应纵轴的模型） */
    setViewRect: function (xmin, xmax, ymin, ymax) {
      var W = canvas.width, Hh = canvas.height;
      var s = Math.min(W / (xmax - xmin), Hh / (ymax - ymin));
      var viewW = W / s, viewH = Hh / s;
      var cx = (xmin + xmax) / 2, cy = (ymin + ymax) / 2;
      this.baseV = { ox: W / 2, oy: Hh / 2, scale: s };
      this.applyTransform(W, Hh);
    },

    /** 在模型默认取景（baseV）上叠加用户缩放/平移，得到实际视口 V */
    applyTransform: function (W, Hh) {
      var b = this.baseV;
      var scale = b.scale * viewZoom;
      var ox = b.ox + viewPanX, oy = b.oy + viewPanY;
      this.V = {
        ox: ox, oy: oy, scale: scale,
        xmin: (0 - ox) / scale,
        xmax: (W - ox) / scale,
        ymin: (oy - Hh) / scale,
        ymax: oy / scale
      };
    },

    X: function (wx) { return this.V.ox + wx * this.V.scale; },
    Y: function (wy) { return this.V.oy - wy * this.V.scale; },

    /** 浅色网格（由全局开关 gridOn 与 showCoord 共同控制） */
    grid: function () {
      if (!gridOn || !showCoord) return;
      var V = this.V;
      ctx.lineWidth = 1; ctx.strokeStyle = '#e3e8f0'; ctx.beginPath();
      for (var gx = Math.ceil(V.xmin); gx <= Math.floor(V.xmax); gx++) {
        var x = this.X(gx); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
      }
      for (var gy = Math.ceil(V.ymin); gy <= Math.floor(V.ymax); gy++) {
        var y = this.Y(gy); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
      }
      ctx.stroke();
    },

    /** 坐标轴 + 刻度数字 + 箭头 + 原点（由 showCoord 开关控制） */
    axes: function () {
      if (!showCoord) return;
      var V = this.V;
      var xcount = Math.floor(V.xmax) - Math.ceil(V.xmin);
      var ycount = Math.floor(V.ymax) - Math.ceil(V.ymin);
      var xstep = xcount > 24 ? Math.ceil(xcount / 24) : 1;
      var ystep = ycount > 24 ? Math.ceil(ycount / 24) : 1;

      // x 轴与箭头
      this.line(V.xmin, 0, V.xmax, 0, '#334155', 2);
      ctx.fillStyle = '#334155';
      var ax = this.X(V.xmax), ay = this.Y(0);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 11, ay - 6); ctx.lineTo(ax - 11, ay + 6); ctx.closePath(); ctx.fill();
      // y 轴与箭头
      this.line(0, V.ymin, 0, V.ymax, '#334155', 2);
      var bx = this.X(0), by = this.Y(V.ymax);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 6, by + 11); ctx.lineTo(bx + 6, by + 11); ctx.closePath(); ctx.fill();

      // 刻度数字（数量多时自动跳步）
      ctx.font = '14px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#64748b';
      for (var i = Math.ceil(V.xmin); i <= Math.floor(V.xmax); i += xstep) {
        if (i === 0) continue;
        var lx = this.X(i), ly = this.Y(0);
        ctx.beginPath(); ctx.moveTo(lx, ly - 5); ctx.lineTo(lx, ly + 5);
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillText(axisLabel(i), lx, ly + 15);
      }
      for (i = Math.ceil(V.ymin); i <= Math.floor(V.ymax); i += ystep) {
        if (i === 0) continue;
        var my = this.Y(i), mx = this.X(0);
        ctx.beginPath(); ctx.moveTo(mx - 5, my); ctx.lineTo(mx + 5, my);
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillText(axisLabel(i), mx - 7, my + 5);
      }
      // 轴字母与原点
      ctx.fillStyle = '#334155';
      ctx.fillText('x', this.X(V.xmax) - 14, this.Y(0) + 18);
      ctx.fillText('y', this.X(0) + 12, this.Y(V.ymax) - 4);
      ctx.fillStyle = '#64748b';
      ctx.fillText('O', this.X(0) + 8, this.Y(0) + 16);
    },

    line: function (x1, y1, x2, y2, color, width, dash) {
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      ctx.moveTo(this.X(x1), this.Y(y1));
      ctx.lineTo(this.X(x2), this.Y(y2));
      ctx.stroke();
      ctx.setLineDash([]);
    },

    dot: function (x, y, r, fill, label, dx, dy, lcolor, lsize, bold) {
      var px = this.X(x), py = this.Y(y);
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      if (label) {
        ctx.font = (bold ? 'bold ' : '') + (lsize || 16) + 'px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = lcolor || '#334155';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, this.X(x + (dx || 0)), this.Y(y + (dy || 0)));
      }
    },

    text: function (x, y, str, opt) {
      opt = opt || {};
      ctx.font = (opt.bold ? 'bold ' : '') + (opt.size || 17) + 'px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = opt.color || '#334155';
      ctx.textAlign = opt.align || 'center';
      ctx.textBaseline = opt.base || 'middle';
      ctx.fillText(str, this.X(x), this.Y(y));
    },

    /** 绘制函数 y=f(x)：遇到断点（无定义/跳跃）自动断开，适合反比例、正切等 */
    plot: function (f, color, width, steps, jump) {
      var V = this.V, n = steps || 400, st = (V.xmax - V.xmin) / n;
      ctx.strokeStyle = color; ctx.lineWidth = width || 3; ctx.setLineDash([]);
      ctx.beginPath();
      var started = false, prev = null;
      for (var i = 0; i <= n; i++) {
        var x = V.xmin + i * st, y = f(x);
        if (y === null || !isFinite(y)) { started = false; prev = null; continue; }
        if (started && prev !== null && Math.abs(y - prev) > (jump || 30)) started = false;
        var px = this.X(x), py = this.Y(y);
        if (started) ctx.lineTo(px, py); else { ctx.moveTo(px, py); started = true; }
        prev = y;
      }
      ctx.stroke(); ctx.setLineDash([]);
    },

    /** 参数曲线：fn(t) → {x, y}，t ∈ [t0, t1] */
    plotParam: function (fn, t0, t1, color, width, steps) {
      var n = steps || 300;
      ctx.strokeStyle = color; ctx.lineWidth = width || 3; ctx.setLineDash([]);
      ctx.beginPath();
      for (var i = 0; i <= n; i++) {
        var t = t0 + (t1 - t0) * i / n, p = fn(t);
        if (!p || !isFinite(p.x) || !isFinite(p.y)) continue;
        if (i === 0) ctx.moveTo(this.X(p.x), this.Y(p.y)); else ctx.lineTo(this.X(p.x), this.Y(p.y));
      }
      ctx.stroke(); ctx.setLineDash([]);
    },

    /** 折线：pts = [{x,y}, ...] */
    poly: function (pts, color, width, dash) {
      ctx.strokeStyle = color; ctx.lineWidth = width || 2.5;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        if (i === 0) ctx.moveTo(this.X(p.x), this.Y(p.y)); else ctx.lineTo(this.X(p.x), this.Y(p.y));
      }
      ctx.stroke(); ctx.setLineDash([]);
    },

    /** 填充 y=f(x) 在 [x0, x1] 与 x 轴之间的区域（正态分布区间用） */
    fillUnder: function (f, x0, x1, color) {
      var V = this.V;
      var start = Math.max(x0, V.xmin), end = Math.min(x1, V.xmax);
      if (end <= start) return;
      var n = 80;
      ctx.beginPath();
      ctx.moveTo(this.X(start), this.Y(0));
      for (var i = 0; i <= n; i++) {
        var x = start + (end - start) * i / n;
        ctx.lineTo(this.X(x), this.Y(f(x)));
      }
      ctx.lineTo(this.X(end), this.Y(0));
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
  };

  function axisLabel(v) {
    if (Math.abs(v) >= 100) return String(Math.round(v));
    if (Math.abs(v) >= 10) return fmt(v);
    return String(v);
  }

  /* ================================================================
     ⑤+ 3D 立体几何：几何体线框数据生成
     ----------------------------------------------------------------
     shapeData(shape) 返回 {edges:[[p1,p2],...], faces:[[p1..p4],...]}
     p = [x, y, z]（世界坐标，观察者在 +z 方向看向原点）
     ================================================================ */
  function shapeData(shape) {
    var edges = [], faces = [], i;
    if (shape === 'cuboid' || shape === 'cube') {
      var a = shape === 'cube' ? 1.2 : 2;      // 正方体棱长 1.2，长方体 2×1.4×1.4
      var b = shape === 'cube' ? 1.2 : 1.4;
      var c = shape === 'cube' ? 1.2 : 1.4;
      var hx = a / 2, hy = b / 2, hz = c / 2;
      var v = [
        [-hx, -hy, -hz], [hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz],
        [-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]
      ];
      var ei = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
      ei.forEach(function (e) { edges.push([v[e[0]], v[e[1]]]); });
      // 六个面（外法向一致，供背面剔除与半透明填充）
      [[0, 3, 2, 1], [4, 5, 6, 7], [0, 4, 7, 3], [1, 2, 6, 5], [3, 7, 6, 2], [0, 1, 5, 4]].forEach(function (f) {
        faces.push(f.map(function (i) { return v[i]; }));
      });
    } else if (shape === 'cylinder' || shape === 'cone') {
      var r = 1, h = 1.6, n2 = 32;   // 32 段圆环，保证轮廓圆滑
      var top = [], bot = [];
      for (i = 0; i < n2; i++) {
        var t = i / n2 * 2 * Math.PI;
        top.push([r * Math.cos(t), h / 2, r * Math.sin(t)]);
        bot.push([r * Math.cos(t), -h / 2, r * Math.sin(t)]);
      }
      if (shape === 'cylinder') {
        for (i = 0; i < n2; i++) {
          edges.push([top[i], top[(i + 1) % n2]]);
          edges.push([bot[i], bot[(i + 1) % n2]]);
          if (i % 2 === 0) edges.push([top[i], bot[i]]);   // 竖棱（隔一条画）
        }
      } else {
        for (i = 0; i < n2; i++) {
          edges.push([bot[i], bot[(i + 1) % n2]]);
          if (i % 2 === 0) edges.push([[0, h / 2, 0], bot[i]]);   // 母线（隔一条画）
        }
      }
    } else if (shape === 'sphere') {
      var r2 = 1.1, MER = 16, PAR = 8, N = 48;   // 16 经线 × 48 段/圈，球面更圆滑
      for (var k = 0; k < MER; k++) {          // 经线（绕 y 轴）
        var al = k / MER * Math.PI, ring = [];
        for (i = 0; i < N; i++) {
          var t2 = i / N * 2 * Math.PI;
          ring.push([r2 * Math.cos(t2) * Math.cos(al), r2 * Math.sin(t2), r2 * Math.cos(t2) * Math.sin(al)]);
        }
        for (i = 0; i < N; i++) edges.push([ring[i], ring[(i + 1) % N]]);
      }
      for (var j = 1; j <= PAR; j++) {         // 纬线
        var phi = j / (PAR + 1) * Math.PI, ring2 = [];
        for (i = 0; i < N; i++) {
          var t3 = i / N * 2 * Math.PI;
          ring2.push([r2 * Math.sin(phi) * Math.cos(t3), r2 * Math.cos(phi), r2 * Math.sin(phi) * Math.sin(t3)]);
        }
        for (i = 0; i < N; i++) edges.push([ring2[i], ring2[(i + 1) % N]]);
      }
    } else if (shape === 'triPrism') {

      var B0 = [-a6 / 2, h6 / 2, rTri / 2], B1 = [a6 / 2, h6 / 2, rTri / 2], B2 = [0, h6 / 2, -rTri];
      var vp = [A0, A1, A2, B0, B1, B2];
      var ep = [[0, 1], [1, 2], [2, 0], [3, 4], [4, 5], [5, 3], [0, 3], [1, 4], [2, 5]];
      ep.forEach(function (e) { edges.push([vp[e[0]], vp[e[1]]]); });
      faces.push([A0, A2, A1]);            // 下底面
      faces.push([B0, B1, B2]);            // 上底面
      faces.push([A0, A1, B1, B0]);        // 三个矩形侧面
      faces.push([A1, A2, B2, B1]);
      faces.push([A2, A0, B0, B2]);
    } else if (shape === 'pyramidFrustum') {
      // 正四棱台：下底边长 1.6、上底边长 0.8、高 1.4
      var s1 = 0.8, s2 = 0.4, hf = 0.7;
      var C0 = [-s1, -hf, -s1], C1 = [s1, -hf, -s1], C2 = [s1, -hf, s1], C3 = [-s1, -hf, s1];
      var D0 = [-s2, hf, -s2], D1 = [s2, hf, -s2], D2 = [s2, hf, s2], D3 = [-s2, hf, s2];
      var vq = [C0, C1, C2, C3, D0, D1, D2, D3];
      var eq = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
      eq.forEach(function (e) { edges.push([vq[e[0]], vq[e[1]]]); });
      faces.push([C0, C1, C2, C3]);        // 下底面
      faces.push([D0, D3, D2, D1]);        // 上底面
      faces.push([C0, D0, D1, C1]);        // 四个梯形侧面
      faces.push([C3, C2, D2, D3]);
      faces.push([C2, C1, D1, D2]);
      faces.push([C3, D3, D0, C0]);        // 左面（梯形，外法向 −x）
    } else if (shape === 'frustum') {
      // 圆台：下底半径 1.2、上底半径 0.6、高 1.6（可看作圆锥截去上部）
      var R = 1.2, rU = 0.6, hF = 1.6, n3 = 32;   // 32 段圆环，保证轮廓圆滑
      var bot2 = [], top2 = [];

        top2.push([rU * Math.cos(t4), hF / 2, rU * Math.sin(t4)]);
      }
      for (i = 0; i < n3; i++) {
        edges.push([bot2[i], bot2[(i + 1) % n3]]);
        edges.push([top2[i], top2[(i + 1) % n3]]);
        if (i % 2 === 0) edges.push([bot2[i], top2[i]]);   // 母线（隔一条画）
      }
    }

  }

        // 模型：单位圆 x² + y² = 1，P(cosθ, sinθ)

          var a0 = d0 * Math.PI / 180;

        ctx.stroke();
        // 半径 OP
        H.line(0, 0, px, py, '#334155', 2.5);
        // sin 段（垂直虚线）、cos 段（水平虚线）
        H.line(px, 0, px, py, '#dc2626', 2, [5, 4]);
        H.line(0, 0, px, 0, '#0f766e', 2, [5, 4]);
        // 标注
        H.text(px / 2, -0.2, 'cosθ=' + fmt2(px), { color: '#0f766e', size: 14 });
        H.text(px + 0.32, py / 2, 'sinθ=' + fmt2(py), { color: '#b91c1c', size: 14, align: 'left' });
        H.text(0.5, 0.55, 'θ=' + S.deg + '°', { color: '#b45309', size: 15 });
        H.dot(px, py, 6, '#2563eb', 'P(cosθ, sinθ)', 0.35, 0.35, '#1d4ed8', 15, true);
        // tan 段：与切线 x=1 的交点 T(1, tanθ)（模型计算 tanθ = sinθ/cosθ）
        if (Math.abs(px) > 1e-6) {
          var ty = py / px;
          H.line(1, 0, 1, ty, '#7c3aed', 1.6, [5, 4]);
          H.dot(1, ty, 5, '#7c3aed', 'T(1, tanθ)', 0.4, 0.35, '#6d28d9', 14);
        }
      },
      formulas: function (S) {
        var th = S.deg * Math.PI / 180;
        var c = Math.cos(th), s = Math.sin(th);
        var t = Math.abs(c) < 1e-9 ? null : s / c;
        setMath(fEq, '\\cos' + S.deg + '^{\\circ}=' + fmt2(c) + ',\\ \\sin' + S.deg + '^{\\circ}=' + fmt2(s),
          'cos' + S.deg + '° = ' + fmt2(c) + '，sin' + S.deg + '° = ' + fmt2(s));
        if (t === null) {
          setMath(fC, '\\tan' + S.deg + '^{\\circ}\\ \\text{无意义（cos}\\theta=0\\text{）}',
            'tan' + S.deg + '° 无意义（cosθ = 0）');
        } else {
          setMath(fC, '\\tan' + S.deg + '^{\\circ}=\\frac{\\sin\\theta}{\\cos\\theta}=' + fmt2(t),
            'tan' + S.deg + '° = sinθ/cosθ = ' + fmt2(t));
        }
        setMath(fE, '\\sin^{2}\\theta+\\cos^{2}\\theta=' + fmt2(s * s + c * c) + '=1',
          'sin²θ + cos²θ = ' + fmt2(s * s + c * c) + ' = 1');
        var d = S.deg % 360;
        var quad;
        if (d === 0) quad = 'x 轴正半轴';
        else if (d === 90) quad = 'y 轴正半轴';
        else if (d === 180) quad = 'x 轴负半轴';
        else if (d === 270) quad = 'y 轴负半轴';
        else if (d < 90) quad = '第一象限';
        else if (d < 180) quad = '第二象限';
        else if (d < 270) quad = '第三象限';
        else quad = '第四象限';
        fNote.textContent = 'θ = ' + S.deg + '°，终边在' + quad + '；sinθ ' +
          (s > 0 ? '为正' : (s < 0 ? '为负' : '为零')) + '，cosθ ' +
          (c > 0 ? '为正' : (c < 0 ? '为负' : '为零'));
        setTable([
          ['角度 θ', S.deg + '°（' + fmt2(th) + ' rad）'],
          ['sinθ', fmt2(s)], ['cosθ', fmt2(c)],
          ['tanθ', t === null ? '无意义' : fmt2(t)],
          ['sin²θ+cos²θ', '1'], ['终边位置', quad]
        ]);

      buttonAction: function (st) { st.penPoints = []; },   // 清空笔迹
      draw: function (S) {
        // ---- 3D 模型：几何体线框（顶点绕 X/Y 轴旋转 → 正交投影） ----
        H.setView(6.5, 6.5);
        var data = shapeData(S.shape);   // 获取当前几何体的棱与面

        // 旋转 + 正交投影（观察者在 +z 方向看向原点）
        function P(v) {
          var b = S.ry * Math.PI / 180, a = S.rx * Math.PI / 180;
          var cb = Math.cos(b), sb = Math.sin(b), ca = Math.cos(a), sa = Math.sin(a);

          var z1 = -v[0] * sb + v[2] * cb;

            H.line(p1.x, p1.y, p2.x, p2.y, '#94a3b8', 1.6);
          });
          H.text(P([2.5, 0, 0]).x, P([2.5, 0, 0]).y, 'x', { color: '#94a3b8', size: 15 });
          H.text(P([0, 2.5, 0]).x, P([0, 2.5, 0]).y, 'y', { color: '#94a3b8', size: 15 });
          H.text(P([0, 0, 2.5]).x, P([0, 0, 2.5]).y, 'z', { color: '#94a3b8', size: 15 });
        }

        // 面（仅长方体）：填充朝向观察者的面（法向 z 分量 > 0）
        data.faces.forEach(function (f) {
          var pts = f.map(P);
          var e1x = pts[1].x - pts[0].x, e1y = pts[1].y - pts[0].y;
          var e2x = pts[2].x - pts[0].x, e2y = pts[2].y - pts[0].y;
          var nz = e1x * e2y - e1y * e2x;
          if (nz > 0) {
            ctx.beginPath();
            pts.forEach(function (p, i) {
              if (i === 0) ctx.moveTo(H.X(p.x), H.Y(p.y)); else ctx.lineTo(H.X(p.x), H.Y(p.y));
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(37,99,235,0.13)';
            ctx.fill();
          }
        });
        // 棱：先画背面（中点 z < 0，远离观察者），再画正面（z > 0）
        // 区分「几何体边」与「内部结构线」：
        //   边（深色突出）= 多面体的棱、旋转体的顶/底圆环
        //   结构线（淡化）= 圆柱/圆锥/圆台的母线、球的经纬线
        var isSolid = S.shape === 'cuboid' || S.shape === 'cube' || S.shape === 'triPrism' || S.shape === 'pyramidFrustum';
        var isRing = S.shape === 'cylinder' || S.shape === 'cone' || S.shape === 'frustum';
        var back = [], front = [];
        data.edges.forEach(function (L) {
          // 用旋转前的原始 y 坐标判断：两端 y 相同 → 圆环（边）；y 不同 → 母线/竖棱（结构线）
          var isEdge = isSolid || (isRing && Math.abs(L[0][1] - L[1][1]) < 1e-9);
          var p1 = P(L[0]), p2 = P(L[1]);
          ((p1.z + p2.z) / 2 > 0 ? front : back).push({ p1: p1, p2: p2, isEdge: isEdge });
        });
        back.forEach(function (L) {
          H.line(L.p1.x, L.p1.y, L.p2.x, L.p2.y, L.isEdge ? '#94a3b8' : '#e2e8f0', L.isEdge ? 1.6 : 1.2);
        });
        front.forEach(function (L) {
          H.line(L.p1.x, L.p1.y, L.p2.x, L.p2.y, L.isEdge ? '#2563eb' : '#cbd5e1', L.isEdge ? 3 : 2);
        });
        // 画笔笔迹（琥珀色，3D 点集，随几何体一起旋转；画在最上层作标注/辅助线）
        if (S.penPoints && S.penPoints.length > 1) {
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
          ctx.beginPath();
          S.penPoints.forEach(function (pt, idx) {
            var pr = P(pt);
            if (idx === 0) ctx.moveTo(H.X(pr.x), H.Y(pr.y)); else ctx.lineTo(H.X(pr.x), H.Y(pr.y));
          });
          ctx.stroke();
          // 笔迹起点小圆点
          var p0 = P(S.penPoints[0]);
          ctx.beginPath(); ctx.arc(H.X(p0.x), H.Y(p0.y), 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#f59e0b'; ctx.fill();
        }
      },
      formulas: function (S) {
        var info = SHAPE_INFO[S.shape];
        setMath(fEq, info.volL, info.volP);
        setMath(fC, info.surfL, info.surfP);
        if (info.euler === null) {
          setMath(fE, '\\text{旋转体含曲面，}V-E+F\\text{不适用}', '旋转体含曲面，V−E+F 不适用');
        } else {
          setMath(fE, 'V-E+F=' + info.euler + '\\ (\\text{欧拉公式})', '欧拉公式：V−E+F = ' + info.euler);
        }
        fNote.textContent = info.note;
        setTable([
          ['几何体', info.name],
          ['顶点数 V', String(info.V)], ['棱数 E', String(info.E)], ['面数 F', String(info.F)],
          ['V−E+F', info.euler === null ? '—' : String(info.euler)],
          ['体积', info.volP.replace('V = ', '')],
          ['表面积', info.surfP.replace('S = ', '')]
        ]);
      },

          return '画笔模式：按住拖动在「' + pn + '平面」作图（笔迹随几何体旋转）；关闭画笔可拖拽视角';
        }
        return '拖动「绕Y轴 / 绕X轴旋转」从任意角度观察；勾选画笔模式可在空间内作图';
      },

        setMath(fEq, 'f(x)=' + fnToLatex(S.expr), 'f(x) = ' + S.expr);
        setMath(fC, '\\text{切点}P(' + fmt(x0) + ',' + (isFinite(y0) ? fmt(y0) : '—') + '),\\ \\text{斜率}k=f\'(x_{0})\\approx' + (isFinite(k) ? fmt2(k) : '—'),
          '切点 P(' + fmt(x0) + ', ' + (isFinite(y0) ? fmt(y0) : '—') + ')，斜率 k = f′(x₀) ≈ ' + (isFinite(k) ? fmt2(k) : '—'));
        setMath(fE, isFinite(k)
            ? '\\text{切线：}y=' + fmt(k) + '(x-' + fmt(x0) + ')' + (y0 >= 0 ? '+' + fmt(y0) : '-' + fmt(-y0))
            : '\\text{切线不可作（切点不在定义域内）}',
          isFinite(k)
            ? '切线：y = ' + fmt(k) + '(x−' + fmt(x0) + ')' + (y0 >= 0 ? '+' + fmt(y0) : '−' + fmt(-y0))
            : '切线不可作（切点不在定义域内）');
        fNote.textContent = '数值求导：f′(x₀) ≈ [f(x₀+h) − f(x₀−h)] / (2h)，h 取很小的数';
        setTable([
          ['表达式', S.expr],
          ['x₀', fmt(x0)],
          ['f(x₀)', isFinite(y0) ? fmt(y0) : '—'],
          ['f′(x₀) ≈', isFinite(k) ? fmt2(k) : '—'],
          ['切线方程', isFinite(k) ? 'y = ' + fmt(k) + 'x ' + (y0 - k * x0 >= 0 ? '+' + fmt(y0 - k * x0) : '-' + fmt(k * x0 - y0)) : '—']
        ]);
      },
      hint: '在输入框键入任意函数（回车确认）即可生成图像；拖动 x₀ 观察切线斜率 f′(x₀) 的变化。'
    }
  ];

  /* ================================================================
     ⑦ 状态初始化：为每个模型建立独立参数状态
     ================================================================ */
  REGISTRY.forEach(function (m) {
    states[m.id] = deepCopy(m.defaults);
    if (m.compile) m.compile(states[m.id]);   // 预编译用户输入型函数（如导数模型）
  });

  function current() {
    return REGISTRY.filter(function (m) { return m.id === currentId; })[0];
  }
  function S() { return states[currentId]; }

  /* ================================================================
     ⑧ 面板构建与控件绑定
     ================================================================ */
  function chkRow(key, label, checked, onChange) {
    var lab = document.createElement('label');
    lab.className = 'chk';
    var inp = document.createElement('input');
    inp.type = 'checkbox'; inp.checked = checked;
    inp.dataset.key = key;   // 标注控件 key，便于识别与调试
    inp.addEventListener('change', function () { onChange(inp.checked); });
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode(label));
    return lab;
  }

  function paintSlider(el) {
    var p = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.background = 'linear-gradient(to right, #2563eb ' + p + '%, #dbe3ee ' + p + '%)';
  }

  /** 把当前模型参数值同步回滑块/数值显示（含联动钳制） */
  function syncSliderValues(m) {
    m.params.forEach(function (p) {
      var el = document.getElementById('sl_' + p.key);
      if (!el) return;
      el.value = S()[p.key];   // range 与 select 通用
      // 注意：必须限定 type='range'——文本输入框(type='text')的 tagName 也是 INPUT，
      //       若误入此分支会对字符串执行 fmt() 抛异常，导致滑块拖动中断（图像无响应）
      if (el.tagName === 'INPUT' && el.type === 'range') {
        if (m.id === 'ellipse' && p.key === 'b') el.max = S().a;   // 椭圆：b 的上限跟随 a
        var vEl = document.getElementById('val_' + p.key);
        if (vEl) vEl.textContent = fmt(S()[p.key]);
        paintSlider(el);
      }
    });
  }

  function buildPanel() {
    var m = current(), st = S();
    panel.innerHTML = '';
    var title = document.createElement('div');
    title.className = 'panel-title';
    title.textContent = m.cat + ' · ' + m.name;
    panel.appendChild(title);

    // 全局开关：显示网格
    panel.appendChild(chkRow('grid', '显示网格', gridOn, function (v) { gridOn = v; draw(); }));

    // 模型专属复选框
    (m.checks || []).forEach(function (c) {
      panel.appendChild(chkRow(c.key, c.label, st[c.key], function (v) {
        S()[c.key] = v;   // 注意：重置按钮会替换状态对象，必须实时取 S()，不能用闭包捕获的 st
        if (c.key === 'demo' && v) ensureDemoLoop();
        draw();
      }));
    });

    // 参数控件（滑块 / 下拉选择）
    m.params.forEach(function (p) {
      var div = document.createElement('div');
      div.className = 'ctrl';
      var head = document.createElement('div');
      head.className = 'ctrl-head';
      var lab = document.createElement('label');
      lab.htmlFor = 'sl_' + p.key; lab.textContent = p.label;
      head.appendChild(lab);
      var cap = document.createElement('div');
      cap.className = 'ctrl-cap'; cap.textContent = p.cap || '';
      div.appendChild(head);

      if (p.type === 'select') {
        // 下拉选择（如 3D 模型的几何体形状）
        var sel = document.createElement('select');
        sel.id = 'sl_' + p.key;
        p.options.forEach(function (o) {
          var op = document.createElement('option');
          op.value = o.v; op.textContent = o.label;
          if (o.v === st[p.key]) op.selected = true;
          sel.appendChild(op);
        });
        sel.addEventListener('change', function () {
          S()[p.key] = this.value;
          refresh();
        });
        div.appendChild(sel);
      } else if (p.type === 'text') {
        // 文本输入（如导数模型的自定义函数表达式）
        var tin = document.createElement('input');
        tin.type = 'text'; tin.id = 'sl_' + p.key;
        tin.className = 'exprInput'; tin.value = st[p.key];
        tin.spellcheck = false;
        tin.addEventListener('change', function () {
          S()[this.id.slice(3)] = this.value;   // 控件 id = 'sl_' + key
          if (m.compile) m.compile(S());        // 重新编译函数表达式
          refresh();
        });
        tin.addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
        div.appendChild(tin);
      } else if (p.type === 'textarea') {
        // 多行文本输入（多函数图像模型用：每行一个函数）
        var ta = document.createElement('textarea');
        ta.id = 'sl_' + p.key;
        ta.className = 'exprInput';
        ta.rows = Math.max(3, String(st[p.key] || '').split('\n').length + 1);
        ta.value = st[p.key];
        ta.spellcheck = false;
        ta.addEventListener('change', function () {
          S()[this.id.slice(3)] = this.value;
          if (m.compile) m.compile(S());
          refresh();
        });
        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) this.blur();   // Ctrl+Enter 确认
        });
        div.appendChild(ta);
      } else if (p.type === 'button') {
        // 操作按钮（如立体几何的「清空笔迹」）
        var btn = document.createElement('button');
        btn.className = 'miniBtn'; btn.id = 'sl_' + p.key;
        btn.textContent = p.label || p.key;
        btn.addEventListener('click', function () {
          if (m.buttonAction) m.buttonAction(S());
          refresh();
        });
        div.appendChild(btn);
      } else {
        var val = document.createElement('span');
        val.className = 'val'; val.id = 'val_' + p.key; val.textContent = fmt(st[p.key]);
        head.appendChild(val);
        var inp = document.createElement('input');
        inp.type = 'range'; inp.id = 'sl_' + p.key;
        inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = st[p.key];
        inp.dataset.key = p.key;
        inp.addEventListener('input', function () {
          S()[this.dataset.key] = parseFloat(this.value);   // 实时取 S()，避免闭包捕获旧状态对象
          if (m.adjust) m.adjust(S());            // 参数联动/越界修正
          syncSliderValues(m);                   // 回写被修正的值与滑块上限
          refresh();
        });
        div.appendChild(inp);
        paintSlider(inp);
      }
      div.appendChild(cap);
      panel.appendChild(div);
    });

    // 重置按钮
    var btn = document.createElement('button');
    btn.id = 'btnReset'; btn.textContent = '重 置 参 数';
    btn.addEventListener('click', function () {
      states[m.id] = deepCopy(m.defaults);   // 恢复该模型的默认参数
      if (m.compile) m.compile(states[m.id]);   // 重新编译函数表达式
      syncSliderValues(m);
      // 复选框状态同步
      Array.prototype.forEach.call(panel.querySelectorAll('input[type="checkbox"]'), function (cb) {
        var row = cb.parentNode;
        if (row.textContent.indexOf('显示网格') >= 0) cb.checked = gridOn;
        else if (m.checks) {
          m.checks.forEach(function (c) {
            if (row.textContent.indexOf(c.label) >= 0) cb.checked = states[m.id][c.key];
          });
        }
      });
      if (m.tick && states[m.id].demo) ensureDemoLoop();
      resetView();   // 重置参数的同时恢复默认视图
      refresh();
    });
    panel.appendChild(btn);

    // 使用说明
    var hint = document.createElement('div');
    hint.className = 'hint'; hint.textContent = m.hint || DEFAULT_NOTE;
    panel.appendChild(hint);
  }

  /* ================================================================
     ⑨ 模型导航（分类 + 按钮）
     ================================================================ */
  var CATS = ['基本函数', '三角函数', '圆锥曲线', '立体几何', '数列与代数', '统计与导数'];
  var activeCat = '基本函数';
  var catRow = document.getElementById('catRow');
  var modelRow = document.getElementById('modelRow');

  function buildNav() {
    catRow.innerHTML = ''; modelRow.innerHTML = '';
    CATS.forEach(function (cat) {
      var b = document.createElement('button');
      b.className = 'catBtn'; b.textContent = cat;
      if (cat === activeCat) b.classList.add('active');
      b.addEventListener('click', function () {
        activeCat = cat;
        Array.prototype.forEach.call(catRow.children, function (el) {
          el.classList.toggle('active', el.textContent === activeCat);
        });
        buildModelButtons();
      });
      catRow.appendChild(b);
    });
    buildModelButtons();
  }
  function buildModelButtons() {
    modelRow.innerHTML = '';
    REGISTRY.filter(function (m) { return m.cat === activeCat; }).forEach(function (m) {
      var b = document.createElement('button');
      b.className = 'modelBtn'; b.textContent = m.name;
      if (m.id === currentId) b.classList.add('active');
      b.addEventListener('click', function () { switchModel(m.id); });
      modelRow.appendChild(b);
    });
  }
  function switchModel(id) {
    currentId = id;
    activeCat = current().cat;
    Array.prototype.forEach.call(catRow.children, function (el) {
      el.classList.toggle('active', el.textContent === activeCat);
    });
    buildModelButtons();
    buildPanel();
    refresh();
    resetView();   // 切换模型后恢复该模型的默认取景
    // 切回带演示动画的模型时，若勾选仍在，恢复动点运动
    var mm = current();
    if (mm.tick && states[id].demo) ensureDemoLoop();
  }

  /* ================================================================
     ⑩ 主绘制与公式刷新
     ================================================================ */
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w === 0 || h === 0) return false;
    var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw; canvas.height = bh;
      return true;
    }
    return false;
  }

  function draw() {
    resizeCanvas();
    var W = canvas.width, Hh = canvas.height;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, Hh);
    var m = current();
    m.draw(S());
    // 左下角提示（模型可自定义；椭圆演示时在 draw 内直接写入）
    if (m.canvasNote) {
      var t = m.canvasNote(S());
      if (t !== null) noteEl.textContent = t;
    }
  }

  function updateFormulas() {
    // 先清空，再填当前模型的公式
    fEq.innerHTML = ''; fC.innerHTML = ''; fE.innerHTML = ''; fNote.textContent = '';
    vtBody.innerHTML = '';
    current().formulas(S());
    typeset();
  }
  function refresh() { draw(); updateFormulas(); }

  /* ================================================================
     ⑪ 演示动画循环（椭圆/双曲线动点 P 等：模型定义 tick(S, dt)
         且勾选了 demo 复选框时运行）
     ================================================================ */
  var rafId = null, lastTs = 0;
  function ensureDemoLoop() {
    if (rafId === null) { lastTs = performance.now(); rafId = requestAnimationFrame(rafLoop); }
  }
  function rafLoop(ts) {
    rafId = null;
    var m = current();
    // 通用演示循环：模型定义 tick(S, dt) 且其 demo 勾选时驱动动画
    if (m.tick && S().demo) {
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      m.tick(S(), dt);
      draw();
      ensureDemoLoop();
    }
  }

  /* ---- 点击/拖动画布：把椭圆演示点 P 移到对应位置 ---- */
  function canvasToWorld(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    var cy = (e.clientY - rect.top) * (canvas.height / rect.height);
    var V = H.V;
    return { x: (cx - V.ox) / V.scale, y: (V.oy - cy) / V.scale };
  }
  /* ---- 视图交互：拖拽平移视图；单击（未拖动）时放置椭圆演示点 P ---- */
  var dragStart = null, dragPan0 = null, dragMoved = false;
  /* ---- 立体几何空间画笔：开启画笔模式后，按住拖动在所选平面记录 3D 笔迹 ---- */
  var penDrawing = false, penLastScreen = null;
  function addPenPoint(e) {
    var st = states.solid;
    if (!st.penPoints) st.penPoints = [];
    var rect = canvas.getBoundingClientRect();
    var sx = (e.clientX - rect.left) * (canvas.width / rect.width);
    var sy = (e.clientY - rect.top) * (canvas.height / rect.height);
    if (penLastScreen && Math.hypot(sx - penLastScreen.x, sy - penLastScreen.y) < 3) return;   // 去抖
    penLastScreen = { x: sx, y: sy };
    var V = H.V;
    var wx = (sx - V.ox) / V.scale, wy = (V.oy - sy) / V.scale;   // 屏幕 → 世界坐标
    // 按所选平面生成 3D 点（笔迹是真正的空间点，随几何体一起旋转）
    var p;
    if (st.penPlane === 'xz') p = [wx, 0, wy];
    else if (st.penPlane === 'yz') p = [0, wx, wy];
    else p = [wx, wy, 0];
    if (st.penPoints.length >= 3000) st.penPoints.shift();   // 上限保护
    st.penPoints.push(p);
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (currentId === 'solid' && S().pen) {
      // 画笔模式：优先作画，不触发平移
      penDrawing = true;
      penLastScreen = null;
      canvas.setPointerCapture(e.pointerId);
      addPenPoint(e);
      draw();
      return;
    }
    var rect = canvas.getBoundingClientRect();
    dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    dragPan0 = { x: viewPanX, y: viewPanY };
    dragMoved = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (penDrawing) { addPenPoint(e); draw(); return; }
    if (!dragStart) return;
    var rect = canvas.getBoundingClientRect();
    var dx = (e.clientX - rect.left) - dragStart.x;
    var dy = (e.clientY - rect.top) - dragStart.y;
    if (!dragMoved && Math.hypot(dx, dy) > 5) dragMoved = true;   // 超过 5px 视为拖拽
    if (dragMoved) {
      viewPanX = dragPan0.x + dx;
      viewPanY = dragPan0.y + dy;
      draw();
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (penDrawing) { penDrawing = false; penLastScreen = null; dragStart = null; return; }
    if (dragStart && !dragMoved) placeDemoPoint(e);   // 单击：放置椭圆演示点 P
    dragStart = null;
  });

  /* ---- 滚轮缩放（以鼠标位置为锚点） ---- */
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var V = H.V;
    var wx = (mx - V.ox) / V.scale, wy = (V.oy - my) / V.scale;   // 锚点世界坐标
    var f = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    var nz = viewZoom * f;
    if (nz < 0.1 || nz > 20) return;                               // 缩放范围限制
    var ns = H.baseV.scale * nz;
    viewZoom = nz;
    viewPanX = mx - wx * ns - H.baseV.ox;
    viewPanY = my + wy * ns - H.baseV.oy;
    draw();
  }, { passive: false });

  /** 恢复默认视图（各模型各自的初始取景） */
  function resetView() {
    viewZoom = 1; viewPanX = 0; viewPanY = 0;
    draw();
  }
  /** 以画布中心为锚点缩放（＋/－按钮用） */
  function zoomAtCenter(f) {
    var V = H.V, W = canvas.width, Hh = canvas.height;
    var wx = (W / 2 - V.ox) / V.scale, wy = (V.oy - Hh / 2) / V.scale;
    var nz = viewZoom * f;
    if (nz < 0.1 || nz > 20) return;
    var ns = H.baseV.scale * nz;
    viewZoom = nz;
    viewPanX = W / 2 - wx * ns - H.baseV.ox;
    viewPanY = Hh / 2 + wy * ns - H.baseV.oy;
    draw();
  }
  document.getElementById('btnZoomIn').addEventListener('click', function () { zoomAtCenter(1.3); });
  document.getElementById('btnZoomOut').addEventListener('click', function () { zoomAtCenter(1 / 1.3); });
  document.getElementById('btnResetView').addEventListener('click', resetView);
  // 坐标系显示开关：点击隐藏/显示坐标轴与网格，方便看图
  var btnCoord = document.getElementById('btnCoord');
  btnCoord.addEventListener('click', function () {
    showCoord = !showCoord;
    btnCoord.textContent = showCoord ? '隐藏坐标系' : '显示坐标系';
    draw();
  });
  function placeDemoPoint(e) {
    if (currentId !== 'ellipse') return;
    var w = canvasToWorld(e);
    var st = states.ellipse;
    // 模型反解：t = atan2(y/b, x/a)，把点击位置投影到椭圆上
    var t = Math.atan2(w.y / st.b, w.x / st.a);
    if (isFinite(t)) { st.demoAngle = t; draw(); }
  }

  /* ================================================================
     ⑫ 等待 MathJax 就绪（最多 4 秒；离线时降级为纯文本公式）
     ================================================================ */
  (function waitMath() {
    var waited = 0;
    (function tick() {
      if (window.MathJax && MathJax.startup) {
        MathJax.startup.promise.then(function () {
          mathReady = true;
          updateFormulas();   // 用当前参数重新排版一遍，保证与滑块一致
        });
      } else if (waited < 4000) {
        waited += 200;
        setTimeout(tick, 200);
      } else {
        mathReady = false;
        updateFormulas();     // 离线：公式区显示纯文本
      }
    })();
  })();

  /* ================================================================
     ⑬ 初始化
     ================================================================ */
  buildNav();
  buildPanel();
  refresh();
  new ResizeObserver(function () { draw(); }).observe(wrap);

  // 保存截图：把当前绘图区导出为 PNG 下载
  document.getElementById('btnShot').addEventListener('click', function () {
    var m = current();
    var a = document.createElement('a');
    a.download = '高中数学_' + m.name + '_' +
      new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // 公式区收放：点击标题条展开/收起（画布尺寸变化由 ResizeObserver 自动重绘）
  document.getElementById('faToggle').addEventListener('click', function () {
    var fa = document.getElementById('formulaArea');
    var collapsed = fa.classList.toggle('collapsed');
    document.getElementById('faArrow').textContent = collapsed ? '▲' : '▼';
    draw();
  });
})();
</script>
</body>
</html>
